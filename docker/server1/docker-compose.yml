version: '3.8'

services:
  server1:
    build:
      context: ../..
      dockerfile: docker/server1/Dockerfile
    image: rdp-msa/server1:latest
    container_name: rdp-server1
    hostname: server1
    ports:
      - "8088:8088"   # Eureka Server
      - "8082:8082"   # Ingestion Service (equity)
      - "8081:8081"   # RefData Service
      - "8092:8092"   # Eligibility Service
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - EUREKA_SERVER_URL=http://server1:8088/eureka,http://server4:8088/eureka
      - SERVER_ID=server1
    networks:
      - rdp-network
    volumes:
      - server1-logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  server1-logs:

networks:
  rdp-network:
    external: true
