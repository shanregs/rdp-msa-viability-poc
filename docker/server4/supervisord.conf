[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:eureka-server]
command=java %(ENV_JAVA_OPTS)s -jar /app/eureka-server.jar --server.port=8088
autostart=true
autorestart=true
priority=1
startsecs=10
stdout_logfile=/var/log/eureka-server.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/eureka-server-error.log
stderr_logfile_maxbytes=10MB
environment=SPRING_PROFILES_ACTIVE="server4"

[program:ingestion-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/ingestion-service.jar --server.port=8084 --spring.profiles.active=supporteventhandler,server4
autostart=true
autorestart=true
priority=2
startsecs=30
stdout_logfile=/var/log/ingestion-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/ingestion-service-error.log
stderr_logfile_maxbytes=10MB
