[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:eureka-server]
command=java %(ENV_JAVA_OPTS)s -jar /app/eureka-server.jar --server.port=8088
autostart=true
autorestart=true
priority=1
startsecs=10
stdout_logfile=/var/log/eureka-server.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/eureka-server-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server4",HOSTNAME="server4"

[program:trade-receiver-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/trade-receiver-service.jar --server.port=8084 --server.id=server4 --spring.profiles.active=supporteventhandler
autostart=true
autorestart=true
priority=2
startsecs=30
stdout_logfile=/var/log/trade-receiver-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/trade-receiver-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server4",HOSTNAME="server4",PROFILE="supporteventhandler"
