version: '3.8'

services:
  server4:
    build:
      context: ../..
      dockerfile: docker/server4/Dockerfile
    image: rdp-msa/server4:latest
    container_name: rdp-server4
    hostname: server4
    ports:
      - "18088:8088"  # Eureka Server (different host port to avoid conflict with server1)
      - "8084:8084"   # Ingestion Service (supporteventhandler)
    environment:
      - JAVA_OPTS=-Xmx384m -Xms192m
      - EUREKA_SERVER_URL=http://server1:8088/eureka,http://server4:8088/eureka
      - SERVER_ID=server4
    networks:
      - rdp-network
    volumes:
      - server4-logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  server4-logs:

networks:
  rdp-network:
    external: true
