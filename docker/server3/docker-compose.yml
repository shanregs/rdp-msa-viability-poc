version: '3.8'

services:
  server3:
    build:
      context: ../..
      dockerfile: docker/server3/Dockerfile
    image: rdp-msa/server3:latest
    container_name: rdp-server3
    hostname: server3
    ports:
      - "18081:8081"  # Reference Lookup Service (different host port to avoid conflict with server1)
      - "18082:8082"  # Trade Receiver Service (irswap)
      - "18092:8092"  # Check Eligible Service
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - EUREKA_SERVER_URL=http://server1:8088/eureka,http://server4:8088/eureka
      - SERVER_ID=server3
    networks:
      - rdp-network
    volumes:
      - server3-logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  server3-logs:

networks:
  rdp-network:
    external: true
