[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:reference-lookup-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/reference-lookup-service.jar --server.port=8081 --server.id=server3
autostart=true
autorestart=true
priority=1
startsecs=10
stdout_logfile=/var/log/reference-lookup-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/reference-lookup-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server3",HOSTNAME="server3"

[program:check-eligible-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/check-eligible-service.jar --server.port=8092 --server.id=server3
autostart=true
autorestart=true
priority=1
startsecs=10
stdout_logfile=/var/log/check-eligible-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/check-eligible-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server3",HOSTNAME="server3"

[program:trade-receiver-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/trade-receiver-service.jar --server.port=8082 --server.id=server3 --spring.profiles.active=irswap
autostart=true
autorestart=true
priority=2
startsecs=30
stdout_logfile=/var/log/trade-receiver-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/trade-receiver-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server3",HOSTNAME="server3",PROFILE="irswap"
