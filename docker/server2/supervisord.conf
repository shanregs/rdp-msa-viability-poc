[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:eq-trade-handler-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/eq-trade-handler-service.jar --server.port=8090 --server.id=server2
autostart=true
autorestart=true
priority=1
startsecs=10
stdout_logfile=/var/log/eq-trade-handler-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/eq-trade-handler-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server2",HOSTNAME="server2"

[program:trade-receiver-service]
command=java %(ENV_JAVA_OPTS)s -jar /app/trade-receiver-service.jar --server.port=8083 --server.id=server2 --spring.profiles.active=forex
autostart=true
autorestart=true
priority=2
startsecs=30
stdout_logfile=/var/log/trade-receiver-service.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/trade-receiver-service-error.log
stderr_logfile_maxbytes=10MB
environment=SERVER_ID="server2",HOSTNAME="server2",PROFILE="forex"
